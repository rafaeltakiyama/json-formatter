<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Viewer & Formatter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: #1e1e1e; color: #d4d4d4; }
    
    .app-wrapper { display: flex; flex-direction: column; height: 100vh; padding: 6px; gap: 6px; }

    /* Barra Superior Ultracompacta (Intacta) */
    .top-bar { display: flex; align-items: center; justify-content: space-between; background: #252526; padding: 4px 8px; border-radius: 4px; height: 36px; border: 1px solid #333; }
    .controls { display: flex; gap: 6px; align-items: center; }
    
    button { padding: 4px 10px; border: none; border-radius: 3px; cursor: pointer; font-weight: 600; font-size: 0.78rem; transition: opacity 0.2s; }
    button:hover { opacity: 0.85; }
    .btn-format { background-color: #0e639c; color: white; }
    .btn-minify { background-color: #238636; color: white; }
    .btn-clear { background-color: #3c3c3c; color: #ccc; }

    .status-badge { font-size: 0.75rem; font-weight: 600; padding: 2px 8px; border-radius: 3px; display: none; }
    .status-badge.valid { background: #123e21; color: #7ee787; border: 1px solid #238636; display: inline-block; }
    .status-badge.invalid { background: #4c3204; color: #f2cc60; border: 1px solid #9e6a03; display: inline-block; }

    /* Área de Editor Editável com Cores */
    .editor-container { flex: 1; width: 100%; height: calc(100% - 42px); }
    
    #jsonText { 
      width: 100%; 
      height: 100%; 
      padding: 6px 8px; 
      border: 1px solid #333; 
      border-radius: 4px; 
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace; 
      font-size: 12px; 
      line-height: 1.25; 
      tab-size: 1; 
      outline: none; 
      background: #1e1e1e; 
      color: #d4d4d4; 
      white-space: pre-wrap; 
      word-break: break-all;
      overflow-y: auto;
    }
    #jsonText:focus { border-color: #0e639c; }

    /* Paleta de Cores do JSON (Estilo VS Code Dark) */
    .json-key { color: #9cdcfe; font-weight: bold; }      /* Propriedades (Chaves) - Azul Claro */
    .json-string { color: #ce9178; }                   /* Textos (Strings) - Laranja/Tijolo */
    .json-number { color: #b5cea8; }                   /* Números - Verde Claro */
    .json-boolean { color: #569cd6; font-weight: bold; }/* Booleans (true/false) - Azul */
    .json-null { color: #569cd6; font-weight: bold; }   /* Null - Azul */
  </style>
</head>
<body>

  <div class="app-wrapper">
    <div class="top-bar">
      <div class="controls">
        <button class="btn-format" onclick="processJSON('format')">Formatar</button>
        <button class="btn-minify" onclick="processJSON('minify')">Uma Linha</button>
        <button class="btn-clear" onclick="clearEditor()">Limpar</button>
      </div>
      <div id="statusBadge" class="status-badge"></div>
    </div>

    <div class="editor-container">
      <div id="jsonText" contenteditable="true" spellcheck="false" placeholder="Cole seu JSON aqui..."></div>
    </div>
  </div>

  <script>
    // Função para aplicar syntax highlighting com Regex
    function syntaxHighlight(json) {
      if (!json) return '';
      json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
        let cls = 'json-number';
        if (/^"/.test(match)) {
          if (/:$/.test(match)) {
            cls = 'json-key';
          } else {
            cls = 'json-string';
          }
        } else if (/true|false/.test(match)) {
          cls = 'json-boolean';
        } else if (/null/.test(match)) {
          cls = 'json-null';
        }
        return '<span class="' + cls + '">' + match + '</span>';
      });
    }

    async function processJSON(action) {
      const editor = document.getElementById('jsonText');
      const statusBadge = document.getElementById('statusBadge');
      const input = editor.innerText.trim();

      if (!input) {
        statusBadge.className = 'status-badge invalid';
        statusBadge.textContent = 'Insira algum texto';
        return;
      }

      try {
        const response = await fetch('/json-formatter/api/process-json', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ jsonString: input, action: action })
        });

        const data = await response.json();
        
        // Aplica as cores no texto formatado devolvido pelo servidor
        editor.innerHTML = syntaxHighlight(data.result);

        if (data.valid) {
          statusBadge.className = 'status-badge valid';
          statusBadge.textContent = action === 'minify' ? '✓ JSON Válido (Linha única)' : '✓ JSON Válido';
        } else {
          statusBadge.className = 'status-badge invalid';
          statusBadge.textContent = '⚠ JSON INVÁLIDO (Formatado via recuperação)';
        }
      } catch (err) {
        statusBadge.className = 'status-badge invalid';
        statusBadge.textContent = 'Erro de comunicação';
      }
    }

    function clearEditor() {
      document.getElementById('jsonText').innerHTML = '';
      document.getElementById('statusBadge').style.display = 'none';
    }
  </script>

</body>
</html>
